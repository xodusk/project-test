<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>유통기한 관리</title>
    <link rel="stylesheet" href="style.css" />

    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/1554/1554401.png">
</head>
<body>
    <div class="container">
    <!-- 탭 메뉴 -->
    <div class="tab-menu">
        <button class="tab-btn active" onclick="switchTab('input', this)">➕ 입력</button>
        <button class="tab-btn" onclick="switchTab('register', this)">📋 등록</button>
        <button class="tab-btn" onclick="switchTab('recipe', this)">🍳 레시피</button>
    </div>

    <!-- 입력 탭 -->
    <div id="tab-input" class="tab-content">
        <h1>식품 입력</h1>
        <input type="text" id="foodName" placeholder="식품 이름 입력" />
        <input type="date" id="expiryDate" />
        <div id="dateCandidates"></div>
        <button onclick="addFood()">추가</button>
        <p id="statusMessage"></p>
        <h3>카메라 입력</h3>
        <button onclick="startCamera()">
    📷 카메라 시작
    </button>

    <button onclick="captureAll()">
    🤖 자동 인식
    </button>

    <button onclick="rescanFoodName()">
    📦 바코드만 다시 찍기
    </button>

    <button onclick="rescanExpiryDate()">
    📅 날짜만 다시 찍기
    </button>

    <button onclick="clearCamera()">
    📷 촬영 종료
    </button>
        <div class="camera-wrapper">
            <video id="camera" autoplay playsinline></video>
            <div id="scanBox"></div>
        </div>
        <button onclick="clearCamera()">촬영 종료</button>
        <canvas id="canvas" style="display:none;"></canvas>
        <img id="preview" style="width:100%; border-radius:12px; margin-top:10px; display:none;" />
    </div>

    <!-- 등록 탭 -->
    <div id="tab-register" class="tab-content" style="display:none;">
        <h1>등록된 식품</h1>
        <p id="todayDate"></p>
        <h3>🟢 유통기한 남은 식품</h3>
        <ul id="validList"></ul>
        <h3>❌ 유통기한 지난 식품</h3>
        <ul id="expiredList"></ul>
    </div>

    <!-- 레시피 탭 -->
    <div id="tab-recipe" class="tab-content" style="display:none;">
        <h1>추천 레시피</h1>
        <button onclick="showRecipes()">레시피 추천 받기</button>
        <button onclick="clearRecipeCache()" style="background:#ff4d4f; color:white;">레시피 캐시 초기화</button>
        <ul id="recipeList"></ul>
    </div>
</div>
<script src="https://unpkg.com/@zxing/library@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="script.js"></script>
<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js')
                .then(reg => console.log('서비스 워커 등록 성공:', reg.scope))
                .catch(err => console.error('서비스 워커 등록 실패:', err));
        });
    }
</script>
</body>
</html>
